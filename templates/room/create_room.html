{% extends 'base.html' %}

{% block title %}Create room | {% endblock %}

{% block content %}
<section class="relative min-h-[calc(100vh-72px)] flex items-center justify-center overflow-hidden bg-linear-to-br from-orange-50 via-white to-amber-50 px-4 py-12">
    <div class="pointer-events-none absolute -top-32 -left-32 h-96 w-96 rounded-full bg-orange-300/40 blur-3xl animate-pulse"></div>
    <div class="pointer-events-none absolute -bottom-32 -right-32 h-96 w-96 rounded-full bg-amber-300/40 blur-3xl animate-pulse [animation-delay:1.5s]"></div>

    <div class="relative w-full max-w-2xl">
        <div class="absolute -inset-2 bg-linear-to-tr from-orange-400 via-amber-300 to-rose-400 rounded-3xl blur-2xl opacity-30"></div>

        <div class="relative bg-white/90 backdrop-blur-xl rounded-3xl shadow-2xl shadow-orange-500/10 ring-1 ring-orange-100 p-8 sm:p-10">
            <div class="flex items-center gap-4 mb-8">
                <a href="{% url 'my_rooms' %}" class="inline-flex items-center justify-center h-10 w-10 rounded-xl bg-orange-50 text-orange-600 hover:bg-orange-100 transition" aria-label="Back to my rooms">
                    <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
                </a>
                <div>
                    <span class="text-xs font-bold uppercase tracking-widest text-orange-600">New space</span>
                    <h1 class="text-2xl sm:text-3xl font-black tracking-tight text-gray-900">Create a room</h1>
                </div>
            </div>

            <form method="post" class="space-y-5">
                {% csrf_token %}

                <div>
                    <label for="{{ form.name.id_for_label }}" class="block text-sm font-semibold text-gray-700 mb-1.5">Room name</label>
                    <input type="text" name="{{ form.name.name }}" id="{{ form.name.id_for_label }}" required maxlength="255"
                        value="{{ form.name.value|default:'' }}"
                        class="w-full px-4 py-3 rounded-xl bg-orange-50/60 ring-1 ring-orange-100 outline-none transition focus:ring-2 focus:ring-orange-400 focus:bg-white placeholder:text-gray-400"
                        placeholder="e.g. Friday Night Movie Club">
                </div>

                <div>
                    <label for="{{ form.description.id_for_label }}" class="block text-sm font-semibold text-gray-700 mb-1.5">
                        Description
                        <span class="ml-1 font-normal text-gray-400">— optional</span>
                    </label>
                    <input type="text" name="{{ form.description.name }}" id="{{ form.description.id_for_label }}" maxlength="200"
                        value="{{ form.description.value|default:'' }}"
                        class="w-full px-4 py-3 rounded-xl bg-orange-50/60 ring-1 ring-orange-100 outline-none transition focus:ring-2 focus:ring-orange-400 focus:bg-white placeholder:text-gray-400"
                        placeholder="What's this room about?">
                </div>

                <label for="{{ form.is_private.id_for_label }}" class="flex items-start gap-3 p-4 rounded-xl ring-1 ring-orange-100 bg-orange-50/40 cursor-pointer hover:bg-orange-50 transition">
                    <input type="checkbox" name="{{ form.is_private.name }}" id="{{ form.is_private.id_for_label }}"
                        {% if form.is_private.value %}checked{% endif %}
                        class="mt-0.5 h-5 w-5 accent-orange-500 cursor-pointer">
                    <div>
                        <div class="font-semibold text-gray-900">Make this room private</div>
                        <div class="text-sm text-gray-500 mt-0.5">You'll pick who's invited on the next step. Only invited people can enter.</div>
                    </div>
                </label>

                {% include "_partials/form_errors.html" %}

                <button type="submit" class="group w-full inline-flex items-center justify-center gap-2 px-6 py-3.5 rounded-xl text-white font-semibold bg-linear-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 shadow-lg shadow-orange-500/30 hover:shadow-orange-500/50 transition-all hover:-translate-y-0.5">
                    Create room
                    <span class="transition-transform group-hover:translate-x-1">&rarr;</span>
                </button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
