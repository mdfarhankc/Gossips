{% load static %}

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>{% block title %}{% endblock %}Gossips</title>

        <link rel="stylesheet" href="{% static 'src/output.css' %}">
        <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">
    </head>

    <body class="min-h-screen bg-white text-gray-900 antialiased">
        <header class="sticky top-0 z-50 backdrop-blur-md bg-white/70 border-b border-orange-100">
            <nav class="max-w-7xl mx-auto flex items-center justify-between py-4 px-6">
                <a href="/" class="flex items-center gap-2 font-black text-xl tracking-tight">
                    <img src="{% static 'images/favicon.png' %}" class="h-8 w-8" alt="Gossips logo">
                    <span class="bg-linear-to-r from-orange-500 to-amber-500 bg-clip-text text-transparent">Gossips</span>
                </a>

                <div class="flex items-center gap-1 sm:gap-2 text-sm font-semibold">
                    {% if request.user.is_authenticated %}
                        <a href="{% url 'rooms' %}" class="px-3 py-2 rounded-lg text-gray-700 hover:text-orange-600 hover:bg-orange-50 transition">Rooms</a>
                        <a href="{% url 'my_rooms' %}" class="px-3 py-2 rounded-lg text-gray-700 hover:text-orange-600 hover:bg-orange-50 transition">My Rooms</a>
                        <a href="{% url 'invited_rooms' %}" class="px-3 py-2 rounded-lg text-gray-700 hover:text-orange-600 hover:bg-orange-50 transition">Invited</a>
                        <a href="{% url 'logout' %}" class="ml-2 px-4 py-2 rounded-lg text-white bg-linear-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 shadow-sm transition">Log out</a>
                    {% else %}
                        <a href="{% url 'login' %}" class="px-3 py-2 rounded-lg text-gray-700 hover:text-orange-600 hover:bg-orange-50 transition">Log in</a>
                        <a href="{% url 'signup' %}" class="ml-1 px-4 py-2 rounded-lg text-white bg-linear-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 shadow-sm transition">Sign up</a>
                    {% endif %}
                </div>
            </nav>
        </header>

        {% block content %}{% endblock %}

        {% block scripts %}{% endblock %}
    </body>
</html>
