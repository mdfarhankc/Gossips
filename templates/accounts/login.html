{% extends 'base.html' %}

{% block title %}Log in | {% endblock %}

{% block content %}
<section class="relative min-h-[calc(100vh-72px)] flex items-center justify-center overflow-hidden bg-linear-to-br from-orange-50 via-white to-amber-50 px-4 py-12">
    <div class="pointer-events-none absolute -top-32 -left-32 h-96 w-96 rounded-full bg-orange-300/40 blur-3xl animate-pulse"></div>
    <div class="pointer-events-none absolute -bottom-32 -right-32 h-96 w-96 rounded-full bg-amber-300/40 blur-3xl animate-pulse [animation-delay:1.5s]"></div>

    <div class="relative w-full max-w-md">
        <div class="absolute -inset-2 bg-linear-to-tr from-orange-400 via-amber-300 to-rose-400 rounded-3xl blur-2xl opacity-30"></div>

        <div class="relative bg-white/90 backdrop-blur-xl rounded-3xl shadow-2xl shadow-orange-500/10 ring-1 ring-orange-100 p-8 sm:p-10">
            <div class="text-center">
                <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-orange-100 text-orange-700 text-xs font-semibold uppercase tracking-wider">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-orange-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-orange-500"></span>
                    </span>
                    Welcome back
                </span>
                <h1 class="mt-5 text-3xl sm:text-4xl font-black tracking-tight text-gray-900">
                    Log in to <span class="bg-linear-to-r from-orange-500 to-amber-500 bg-clip-text text-transparent">Gossips</span>
                </h1>
                <p class="mt-2 text-sm text-gray-500">Pick up the conversation right where you left off.</p>
            </div>

            <form method="post" action="." class="mt-8 space-y-5">
                {% csrf_token %}

                <div>
                    <label for="id_username" class="block text-sm font-semibold text-gray-700 mb-1.5">Username</label>
                    <div class="relative">
                        <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-400">
                            <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                        </span>
                        <input id="id_username" type="text" name="username" autocomplete="username" required
                            value="{{ form.username.value|default:'' }}"
                            class="w-full pl-10 pr-4 py-3 rounded-xl bg-orange-50/60 ring-1 ring-orange-100 outline-none transition focus:ring-2 focus:ring-orange-400 focus:bg-white placeholder:text-gray-400"
                            placeholder="your.handle">
                    </div>
                </div>

                <div>
                    <label for="id_password" class="block text-sm font-semibold text-gray-700 mb-1.5">Password</label>
                    <div class="relative">
                        <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-400">
                            <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                        </span>
                        <input id="id_password" type="password" name="password" autocomplete="current-password" required
                            class="w-full pl-10 pr-4 py-3 rounded-xl bg-orange-50/60 ring-1 ring-orange-100 outline-none transition focus:ring-2 focus:ring-orange-400 focus:bg-white placeholder:text-gray-400"
                            placeholder="••••••••">
                    </div>
                </div>

                {% include "_partials/form_errors.html" %}

                <button type="submit" class="group w-full inline-flex items-center justify-center gap-2 px-6 py-3.5 rounded-xl text-white font-semibold bg-linear-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 shadow-lg shadow-orange-500/30 hover:shadow-orange-500/50 transition-all hover:-translate-y-0.5">
                    Log in
                    <span class="transition-transform group-hover:translate-x-1">&rarr;</span>
                </button>
            </form>

            <p class="mt-6 text-center text-sm text-gray-500">
                New to Gossips?
                <a href="{% url 'signup' %}" class="font-semibold text-orange-600 hover:text-orange-700">Create an account</a>
            </p>
        </div>
    </div>
</section>
{% endblock %}
