{# Form error banner. Reads `form` from the surrounding context. #}
{% if form.errors %}
<div class="rounded-xl bg-rose-50 ring-1 ring-rose-200 p-4 flex gap-3">
    <svg class="h-5 w-5 text-rose-500 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M5.07 19h13.86a2 2 0 001.74-3L13.74 4a2 2 0 00-3.48 0L3.34 16a2 2 0 001.73 3z"/></svg>
    <div class="text-sm text-rose-700 space-y-1">
        {% for field in form %}
            {% for error in field.errors %}<p>{{ error|escape }}</p>{% endfor %}
        {% endfor %}
        {% for error in form.non_field_errors %}<p>{{ error|escape }}</p>{% endfor %}
    </div>
</div>
{% endif %}
